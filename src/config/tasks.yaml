ingredient_detection_task:
  description: >
    Identify ingredients visible in the supplied image using the
    ingredient extraction tool. Do not invent ingredients.
  agent: ingredient_detection_agent
  expected_output: >
    A list of identified ingredients, including uncertainty where relevant.

dietary_filtering_task:
  description: >
    Clean the extracted ingredients, then filter them according to
    the user's dietary restrictions.
  agent: dietary_filtering_agent
  expected_output: >
    A cleaned list of ingredients compatible with the user's restrictions.

nutrient_analysis_task:
  description: >
    Estimate the calories, macronutrients, and relevant micronutrients
    of the filtered ingredients. Clearly state assumptions and uncertainty.
  agent: nutrient_analysis_agent
  expected_output: >
    A nutritional report containing estimates and their limitations.

recipe_suggestion_task:
  description: >
    Generate recipes using the filtered ingredients, nutritional analysis,
    dietary restrictions, and calorie goal. Include ingredient quantities,
    preparation steps, serving sizes, and estimated nutrition.
  agent: recipe_suggestion_agent
  expected_output: >
    Practical recipe suggestions with estimated nutritional values.